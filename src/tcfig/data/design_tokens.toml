version = "0.2.0"

[typography]
families = ["Arial", "Helvetica", "Liberation Sans", "DejaVu Sans"]
math_family = "stixsans"
weight_regular = "normal"
weight_emphasis = "bold"

[line]
data_pt = 1.0
emphasis_pt = 1.4
axis_pt = 0.5
grid_pt = 0.35
error_pt = 0.6
replica_pt = 0.65

[marker]
size_pt = 3.8
edge_pt = 0.5

[layout]
panel_gap_mm = 4.0
outer_pad_mm = 1.5
axes_pad_mm = 1.5

[layout.heights_mm.single]
compact = 50.0
standard = 70.0
tall = 95.0
full = 130.0

[layout.heights_mm.intermediate]
compact = 60.0
standard = 85.0
tall = 115.0
full = 150.0

[layout.heights_mm.double]
compact = 70.0
standard = 105.0
tall = 150.0
full = 180.0

[color.semantic]
foreground = "#171717"
secondary = "#666666"
muted = "#A6A6A6"
light = "#D9D9D9"
missing = "#E5E5E5"
background = "#FFFFFF"
reference = "#4D4D4D"

[color.palettes]
tol_high_contrast = ["#004488", "#DDAA33", "#BB5566"]
tol_bright = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377", "#BBBBBB"]
tol_muted = ["#CC6677", "#332288", "#DDCC77", "#117733", "#88CCEE", "#882255", "#44AA99", "#999933", "#AA4499"]
tol_medium_contrast = ["#6699CC", "#004488", "#EECC66", "#994455", "#997700", "#EE99AA"]
tol_vibrant = ["#EE7733", "#0077BB", "#33BBEE", "#EE3377", "#CC3311", "#009988", "#BBBBBB"]
tol_dark = ["#4477BB", "#CC4466", "#228833", "#2255AA", "#993366", "#006644", "#117788", "#882288", "#BB4488", "#775500", "#444444"]
tol_light = ["#77AADD", "#EE8866", "#EEDD88", "#FFAABB", "#99DDFF", "#44BB99", "#BBCC33", "#AAAA00", "#DDDDDD"]
tol_pale = ["#AACCEE", "#CCEEFF", "#BBDDBB", "#EEEEBB", "#FFBBCC", "#EEBBDD", "#DDDDDD"]
okabe_ito = ["#000000", "#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7"]

[color.colormaps]
scientific_sequential = "batlow"
scientific_diverging = "vik"
scientific_cyclic = "romaO"
fallback_sequential = "viridis"
fallback_diverging = "RdBu_r"
fallback_cyclic = "twilight"

[color.colormap_anchors]
tol_sunset = ["#364B9A", "#4A7BB7", "#6EA6CD", "#98CAE1", "#C2E4EF", "#EAECCC", "#FEDA8B", "#FDB366", "#F67E4B", "#DD3D2D", "#A50026"]
tol_nightfall = ["#125A56", "#00767B", "#238F9D", "#42A7C6", "#60BCE9", "#9DCCEF", "#C6DBED", "#DEE6E7", "#ECEADA", "#F0E6B2", "#F9D576", "#FFB954", "#FD9A44", "#F57634", "#E94C1F", "#D11807", "#A01813"]
tol_burd = ["#2166AC", "#4393C3", "#92C5DE", "#D1E5F0", "#F7F7F7", "#FDDBC7", "#F4A582", "#D6604D", "#B2182B"]
tol_prgn = ["#762A83", "#9970AB", "#C2A5CF", "#E7D4E8", "#F7F7F7", "#D9F0D3", "#ACD39E", "#5AAE61", "#1B7837"]
tol_ylorbr = ["#FFFFE5", "#FFF7BC", "#FEE391", "#FEC44F", "#FB9A29", "#EC7014", "#CC4C02", "#993404", "#662506"]
tol_iridescent = ["#FEFBE9", "#FCF7D5", "#F5F3C1", "#EAF0B5", "#DDECBF", "#D0E7CA", "#C2E3D2", "#B5DDD8", "#A8D8DC", "#9BD2E1", "#8DCBE4", "#81C4E7", "#7BBCE7", "#7EB2E4", "#88A5DD", "#9398D2", "#9B8AC4", "#9D7DB2", "#9A709E", "#906388", "#805770", "#684957", "#46353A"]

[layout.assemblies.lead_right]
description = "Dominant analysis at left, two supporting panels at right"
mosaic = ["AAB", "AAC"]
width_ratios = [1.0, 1.0, 0.88]
height_ratios = [1.0, 1.0]
default_width = "double"
default_height = "standard"

[layout.assemblies.lead_top]
description = "Wide overview above two aligned detail panels"
mosaic = ["AA", "BC"]
width_ratios = [1.0, 1.0]
height_ratios = [1.35, 1.0]
default_width = "double"
default_height = "standard"

[layout.assemblies.wide_triptych]
description = "Wide overview above three compact diagnostics"
mosaic = ["AAA", "BCD"]
width_ratios = [1.0, 1.0, 1.0]
height_ratios = [1.35, 1.0]
default_width = "double"
default_height = "tall"

[layout.assemblies.staggered]
description = "Two wide and two narrow panels with intentionally offset boundaries"
mosaic = ["AAB", "CDD"]
width_ratios = [1.0, 1.0, 1.0]
height_ratios = [1.0, 1.0]
default_width = "double"
default_height = "standard"

[layout.assemblies.sidebar_matrix]
description = "Long contextual panel beside one wide and two compact panels"
mosaic = ["ABB", "ACD"]
width_ratios = [0.82, 1.0, 1.0]
height_ratios = [1.0, 1.0]
default_width = "double"
default_height = "tall"

[layout.assemblies.long_story]
description = "Tall single-column narrative with overview, paired details and summary"
mosaic = ["AA", "AA", "BC", "DD"]
width_ratios = [1.0, 1.0]
height_ratios = [1.0, 1.0, 1.0, 0.85]
default_width = "single"
default_height = "full"

[validation]
forbidden_colormaps = ["jet", "rainbow", "gist_rainbow", "hsv", "nipy_spectral"]
dimension_tolerance_mm = 0.15

[export]
formats = ["pdf", "svg", "png"]
png_dpi = 600
transparent = false
